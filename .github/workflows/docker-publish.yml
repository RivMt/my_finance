name: Build and Publish Docker Image

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    tags: [ 'v*.*.*' ]
    branches:
      - "dev"
      - "docker"
      - "master"

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: "docker.io"
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
  GCP_SSH_USERNAME: ${{ secrets.GCP_SSH_USERNAME }}
  GCP_SSH_PASSWORD: ${{ secrets.GCP_SSH_PASSWORD }}
  GCP_SSH_COMMAND: ${{ vars.GCP_SSH_COMMAND }}


jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.build-metadata.outputs.build_version }}
      docker_tag: ${{ steps.build-metadata.outputs.docker_tag }}
      mode: ${{ steps.build-metadata.outputs.mode }}

    steps:
      - name: Configure build metadata
        id: build-metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "build_version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
            mode="production"
          else
            echo "build_version=0.0.0" >> "${GITHUB_OUTPUT}"
            case "${GITHUB_REF_NAME}" in
              master) mode="edge" ;;
              dev) mode="dev" ;;
              *) mode="production" ;;
            esac
          fi
          echo "docker_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

  build-web:
    needs: metadata
    uses: ./.github/workflows/flutter-web-build.yml
    with:
      base_href: /
      build_name: ${{ needs.metadata.outputs.build_version }}
      mode: ${{ needs.metadata.outputs.mode }}

  build:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build-web
    permissions:
      contents: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Pull LFS
      - name: Pull LFS objects
        run: git lfs pull

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.3.0
        with:
          cosign-release: 'v2.2.2'

      # Attach the web build to the GitHub release for tag builds
      - name: Package web build
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          artifact="my_finance-web-${GITHUB_REF_NAME}.zip"
          cd build/web
          zip -r "../../${artifact}" .

      - name: Attach web build to GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="my_finance-web-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifact}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${artifact}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.docker_tag }}
            type=raw,value=release,enable=${{ github.ref_type == 'tag' }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Authenticate GCP
        if: github.ref_type == 'tag'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ env.GCP_SA_KEY }}'

      - name: Setup Google Cloud SDK
        if: github.ref_type == 'tag'
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull and Up docker container in GCP
        if: github.ref_type == 'tag'
        run: gcloud compute ssh ${{ env.GCP_SSH_USERNAME }}@${{ env.GCP_INSTANCE }} --zone=us-west1-a --command="${{ env.GCP_SSH_COMMAND }}"
