name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.build-metadata.outputs.mode }}

    steps:
      - name: Configure build metadata
        id: build-metadata
        run: echo "mode=demo" >> "${GITHUB_OUTPUT}"

  build-web:
    needs: metadata
    uses: ./.github/workflows/flutter-web-build.yml
    with:
      base_href: /${{ github.event.repository.name }}/
      build_name: 0.0.0
      mode: ${{ needs.metadata.outputs.mode }}

  prepare-pages:
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web

      # The app uses path-based URLs, so let Pages serve Flutter for deep links.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
