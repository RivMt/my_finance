name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create demo config
        shell: bash
        run: |
          mkdir -p assets/key
          printf '{}' > assets/key/config.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get && flutter pub upgrade

      - name: Generate locale keys
        run: dart run easy_localization:generate -S assets/locale -f keys -o locale_keys.g.dart

      - name: Generate demo icons
        shell: bash
        run: bash assets/script/icongen.sh demo

      - name: Configure demo app name
        shell: bash
        run: bash assets/script/appname.sh demo

      - name: Build demo web app
        shell: bash
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define="MYSUITE_MODE=demo"

      - name: Copy generated SVG icon
        run: cp web/icons/Icon.svg build/web/icons/Icon.svg

      # The app uses path-based URLs, so let Pages serve Flutter for deep links.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
