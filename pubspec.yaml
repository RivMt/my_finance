name: my_finance
description: Personal finance management application

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: '>=2.18.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  my_api:
    path: ../my_api
  hooks_riverpod:
  easy_localization:
  decimal:
  grouped_list:
  flutter_colorpicker: ^1.0.3
  file_picker: ^5.2.5
  csv: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/key/
    - assets/locale/
  fonts:
    - family: CurrencySymbol
      fonts:
        - asset: packages/my_api/fonts/CurrencySymbol.ttf