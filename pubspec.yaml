name: my_finance
description: Personal finance management application

publish_to: 'none'

version: 0.3.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  my_api:
    git:
      url: https://github.com/RivMt/my_api
      ref: master
  hooks_riverpod:
  easy_localization:
  decimal:
  fl_chart:
  grouped_list: ^6.0.0
  flutter_colorpicker: ^1.1.0
  file_picker: ^12.0.0
  csv: ^8.0.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/key/
    - assets/locale/
    - assets/icon/