flutter_icons:
  image_path: "assets/icon/icon-desktop.png" # 512x512
  # Android
  android: "launcher_icon"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png" # 1024x1024
  adaptive_icon_background: "#FFFFFF"
  # iOS
  ios: true
  image_path_ios: "assets/icon/icon-full.png" # 1024x1024
  # Windows
  windows:
    generate: true
    icon_size: 48
  # Web
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#2196F3"
  # macOS
  macos:
    generate: true
    image_path: "assets/icon/icon-full.png" # 1024x1024